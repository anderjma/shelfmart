<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="content-language" content="es, en" />
    
    <title>ShelfMart</title>
    <meta name="description" content="Business platform for inventory management, product catalog, and sales control. Optimize your business resources with cutting-edge technology." />
    <meta name="keywords" content="inventory, e-commerce, business management, B2B, shopping, Costa Rica, business software" />
    <meta name="author" content="anderjma" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shelfmart.vercel.app/" />
    <meta property="og:title" content="ShelfMart" />
    <meta property="og:description" content="Discover our business commerce and inventory platform. Exclusive deals and full real-time stock control." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1200&auto=format&fit=crop" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShelfMart" />
    <meta name="twitter:description" content="Complete inventory and sales system with a real-time administrative panel." />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (function() {
        try {
          const savedLang = localStorage.getItem('shelfmart_lang') || 'es';
          document.documentElement.lang = savedLang;
          document.documentElement.dir = 'ltr';
        } catch (e) {}

        const updateFavicon = () => {
          let isDark = false;
          try {
            const saved = localStorage.getItem('shelfmart_theme');
            if (saved === 'dark') isDark = true;
            else if (saved === 'light') isDark = false;
            else isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          const faviconSvg = isDark ? '/favicon-dark.svg' : '/favicon-light.svg';
          const iconLinks = document.querySelectorAll("link[rel*='icon']");
          iconLinks.forEach(link => {
            link.href = faviconSvg + '?v=' + (isDark ? 'dark' : 'light');
            if (link.type !== 'image/svg+xml') {
              link.type = 'image/svg+xml';
            }
          });
        };

        try {
          updateFavicon();
          if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  </head>
  <body class="font-sans antialiased text-ink-900 bg-cream-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
