name: Keep Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://p01--shelfmart--g4jf7cpt6nw7.code.run/health)
          echo "Health check responded with status $status"
          if [ "$status" != "200" ]; then
            echo "Health check failed with status $status"
            exit 1
          fi
